name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy -- -D warnings

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071: rsa vulnerability in sqlx-mysql (unused)
          # RUSTSEC-2024-0436: paste is unmaintained (transitive from ratatui)
          # RUSTSEC-2026-0002: lru soundness issue (transitive from ratatui)
          # RUSTSEC-2026-0037: quinn-proto DoS (transitive from reqwest, upgrade checker only)
          # RUSTSEC-2026-0049: rustls-webpki CRL matching (transitive from reqwest, low impact)
          ignore: RUSTSEC-2023-0071, RUSTSEC-2024-0436, RUSTSEC-2026-0002, RUSTSEC-2026-0037, RUSTSEC-2026-0049
