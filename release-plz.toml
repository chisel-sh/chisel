# release-plz.toml
# Configures automated release PRs and changelogs

[workspace]
# Settings here apply to all packages in the workspace
semver_check = true
# release-plz uses Conventional Commits by default.

# Disable GitHub Release creation — cargo-dist handles that via release.yml.
# cargo-dist creates the GitHub Release when binary builds complete.
git_release_enable = false

[[package]]
name = "chisel"
publish = false

[changelog]
# Customize how the changelog looks
header = """
# Changelog
All notable changes to this project will be documented in this file.
"""
trim = true
