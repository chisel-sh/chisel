# release-plz.toml
# Configures automated release PRs and changelogs

[workspace]
# Settings here apply to all packages in the workspace
semver_check = true
# release-plz uses Conventional Commits by default.

# Let release-plz create git tags but NOT GitHub Releases.
# cargo-dist (release.yml) handles GitHub Release creation with binary artifacts.
git_release_enable = false

[[package]]
name = "chisel"
publish = false

[changelog]
# Customize how the changelog looks
header = """
# Changelog
All notable changes to this project will be documented in this file.
"""
trim = true
